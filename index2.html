<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>シフト給与管理PRO｜木屋町御池 & 烏丸三条</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink:#0F1612;--ink2:#3D4A42;--ink3:#7A8C81;
  --paper:#F5F3EE;--paper2:#EAE8E2;--surface:#FFFFFF;
  --green:#1A7A56;--green2:#0F5038;--green-pale:#D4EDDF;
  --amber:#C87A1A;--amber-pale:#FBF0DC;
  --purple:#5B4B8A;--purple-pale:#EDE8F8;
  --red:#A02828;--red-pale:#F8E8E8;
  --blue:#1A5CA0;--blue-pale:#E0ECFB;
  --border:rgba(15,22,18,0.10);--border2:rgba(15,22,18,0.06);
  --shadow:0 12px 32px -4px rgba(15,22,18,0.04), 0 4px 12px -2px rgba(15,22,18,0.02);
  --radius:16px;--radius-sm:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Zen Kaku Gothic New',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;padding-bottom:120px;line-height:1.5}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:1.25rem 1rem;position:sticky;top:0;z-index:100}
.header-inner{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.logo{font-weight:900;font-size:18px;letter-spacing:-0.5px;color:var(--green);display:flex;align-items:center;gap:6px}
.logo span{font-size:11px;background:var(--green-pale);color:var(--green);padding:2px 8px;border-radius:20px;font-weight:700}
.nav-tabs{display:flex;background:var(--paper2);padding:4px;border-radius:12px;gap:2px;overflow-x:auto}
.tab-btn{background:none;border:none;padding:8px 14px;font-size:13px;font-weight:700;color:var(--ink3);border-radius:8px;cursor:pointer;white-space:nowrap;transition:all 0.2s}
.tab-btn.active{background:var(--surface);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,0.04)}
.container{max-width:1200px;margin:1.5rem auto;padding:0 1rem}
.tab-content{display:none}.tab-content.active{display:block}
.grid{display:grid;grid-template-columns:1fr;gap:1.5rem}
@media(min-width:992px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border-radius:var(--radius);padding:1.5rem;box-shadow:var(--shadow);border:1px solid var(--border2);position:relative;overflow:hidden;margin-bottom:1.5rem}
.card-title{font-size:15px;font-weight:700;margin-bottom:1.25rem;color:var(--ink2);display:flex;align-items:center;justify-content:space-between}
.form-group{margin-bottom:1.25rem}.form-group:last-child{margin-bottom:0}
label{display:block;font-size:12px;font-weight:700;color:var(--ink3);margin-bottom:6px}
.input,select,textarea{width:100%;background:var(--paper);border:1px solid transparent;border-radius:var(--radius-sm);padding:12px;font-size:15px;font-family:inherit;color:var(--ink);outline:none;transition:all 0.2s}
.input:focus,select:focus,textarea:focus{background:var(--surface);border-color:var(--green)}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:none;border-radius:var(--radius-sm);padding:14px;font-size:15px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all 0.2s;text-decoration:none;width:100%}
.btn-green{background:var(--green);color:var(--surface)}.btn-green:hover{background:var(--green2)}
.btn-amber{background:var(--amber);color:var(--surface)}
.btn-red{background:var(--red);color:var(--surface)}
.btn-ghost{background:var(--paper2);color:var(--ink2)}
.btn-ghost:hover{background:var(--border)}
.store-tag{font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px}
.store-k{background:var(--purple-pale);color:var(--purple)}
.store-r{background:var(--amber-pale);color:var(--amber)}
.record-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border2)}
.record-item:last-child{border-bottom:none}
.time-mono{font-family:'DM Mono',monospace;font-weight:500;font-size:14px}
.badge-in{background:var(--green-pale);color:var(--green);padding:2px 6px;border-radius:4px;font-size:11px;font-weight:700}
.badge-out{background:var(--red-pale);color:var(--red);padding:2px 6px;border-radius:4px;font-size:11px;font-weight:700}
.summary-box{background:var(--paper);border-radius:var(--radius-sm);padding:1rem;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center}
.role-badge{position:fixed;bottom:20px;right:20px;z-index:200;background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:30px;font-size:12px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,0.15);cursor:pointer;display:flex;align-items:center;gap:6px}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,22,18,0.4);backdrop-filter:blur(4px);z-index:300;display:none;align-items:center;justify-content:center;padding:1rem}
.modal-content{background:var(--surface);border-radius:var(--radius);padding:1.5rem;max-width:460px;width:100%;box-shadow:var(--shadow)}
.admin-only{display:none !important}.is-admin .admin-only{display:flex !important}div.admin-only.card, div.admin-only.summary-box{display:block !important}
.loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(245,243,238,0.8); z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; color: var(--green); }
.spinner { width: 40px; height: 40px; border: 4px solid var(--paper2); border-top-color: var(--green); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
/* 集計テーブル用スタイル */
.table-responsive { width: 100%; overflow-x: auto; margin-top: 10px; }
table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
th, td { padding: 10px; border-bottom: 1px solid var(--border2); white-space: nowrap; }
th { background: var(--paper); color: var(--ink2); font-weight: 700; }
.text-right { text-align: right; }
</style>
</head>
<body>

<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <div>Googleスプレッドシートから同期中...</div>
</div>

<header class="header">
  <div class="header-inner">
    <div class="logo">勤怠・給与管理 <span>PRO</span></div>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('timecard')">⏰ 打刻</button>
      <button class="tab-btn" onclick="switchTab('dashboard')">📊 履歴明細</button>
      <button class="tab-btn admin-only" onclick="switchTab('monthly')">📅 月次集計</button>
      <button class="tab-btn admin-only" onclick="switchTab('yearly')">📈 年次集計</button>
      <button class="tab-btn admin-only" onclick="switchTab('settings')">⚙️ 設定</button>
    </div>
  </div>
</header>

<div class="container">
  <div id="tab-timecard" class="tab-content active">
    <div class="grid">
      <div class="card">
        <div class="card-title">リアルタイム打刻</div>
        <div class="form-group">
          <label>勤務する店舗を選択</label>
          <select id="ci-store">
            <option value="木屋町御池個室店">木屋町御池個室店</option>
            <option value="烏丸三条個室店">烏丸三条個室店</option>
          </select>
        </div>
        <div class="form-group">
          <label>スタッフ名（どちらの店舗所属の人でも選択可能です）</label>
          <select id="ci-staff"></select>
        </div>
        <div class="form-group">
          <label>備考（遅刻・早退理由など）</label>
          <input type="text" id="ci-note" class="input" placeholder="特になし">
        </div>
        <div class="form-group" style="margin-top:1.5rem">
          <div class="btn-grid">
            <button class="btn btn-green" onclick="registerRecord('出勤')">☀️ 出勤</button>
            <button class="btn btn-red" onclick="registerRecord('退勤')">🌙 退勤</button>
          </div>
        </div>
      </div>
      
      <div class="card">
        <div class="card-title">本日の打刻ログ</div>
        <div id="today-logs" style="max-height:280px;overflow-y:auto"></div>
      </div>
    </div>
  </div>

  <div id="tab-dashboard" class="tab-content">
    <div class="card">
      <div class="card-title">表示フィルター</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
        <div>
          <label>対象月</label>
          <select id="filter-month" onchange="renderDashboard()"></select>
        </div>
        <div>
          <label>勤務した店舗</label>
          <select id="filter-store" onchange="renderDashboard()">
            <option value="ALL">両店舗すべて</option>
            <option value="木屋町御池個室店">木屋町御池</option>
            <option value="烏丸三条個室店">烏丸三条</option>
          </select>
        </div>
      </div>
      <div class="admin-only" style="width:100%">
        <label>スタッフ絞り込み</label>
        <select id="filter-staff" onchange="renderDashboard()"></select>
      </div>
    </div>

    <div class="card" id="history-card-wrapper">
      <div class="card-title">出退勤明細（ペアが成立した勤務履歴）</div>
      <div id="history-log-list" style="max-height:500px;overflow-y:auto"></div>
    </div>
  </div>

  <div id="tab-monthly" class="tab-content admin-only">
    <div class="card">
      <div class="card-title">
        <div>月次給与・各種手当一覧</div>
        <button class="btn btn-ghost" style="padding:4px 10px;font-size:11px;width:auto" onclick="copyTableToClipboard('monthly-table')">📋 表をコピー</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px">
        <div>
          <label>集計対象月</label>
          <select id="monthly-select-month" onchange="renderMonthlySummary()"></select>
        </div>
        <div>
          <label>集計対象店舗</label>
          <select id="monthly-select-store" onchange="renderMonthlySummary()"></select>
        </div>
      </div>
      <div class="table-responsive">
        <table id="monthly-table">
          <thead>
            <tr>
              <th>スタッフ名</th>
              <th>元所属</th>
              <th class="text-right">日数</th>
              <th class="text-right">労働時間</th>
              <th class="text-right">時間給</th>
              <th class="text-right">交通費</th>
              <th class="text-right">深夜手当</th>
              <th class="text-right" style="background:var(--green-pale);color:var(--green)">総支給額</th>
            </tr>
          </thead>
          <tbody id="monthly-summary-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="tab-yearly" class="tab-content admin-only">
    <div class="card">
      <div class="card-title">年次人件費総計</div>
      <div class="form-group" style="max-width:200px">
        <label>集計対象年</label>
        <select id="yearly-select-year" onchange="renderYearlySummary()">
          <option value="2026">2026年</option>
          <option value="2027">2027年</option>
        </select>
      </div>
      <div class="grid" style="grid-template-columns:1fr;gap:1rem;margin-bottom:1.5rem">
        <div class="summary-box" style="background:var(--purple-pale)">
          <div>
            <div style="font-size:12px;color:var(--purple);font-weight:700">木屋町御池個室店 年間総人件費</div>
            <div id="year-kiyamachi-total" style="font-size:20px;font-weight:900">¥0</div>
          </div>
        </div>
        <div class="summary-box" style="background:var(--amber-pale)">
          <div>
            <div style="font-size:12px;color:var(--amber);font-weight:700">烏丸三条個室店 年間総人件費</div>
            <div id="year-karasuma-total" style="font-size:20px;font-weight:900">¥0</div>
          </div>
        </div>
      </div>
      
      <div class="card-title">月別総支給推移</div>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>対象月</th>
              <th class="text-right">木屋町御池</th>
              <th class="text-right">烏丸三条</th>
              <th class="text-right" style="font-weight:700">合計人件費</th>
            </tr>
          </thead>
          <tbody id="yearly-summary-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="tab-settings" class="tab-content admin-only">
    <div class="grid">
      <div class="card">
        <div class="card-title">スタッフ新規登録</div>
        <div class="form-group">
          <label>名前</label>
          <input type="text" id="new-name" class="input" placeholder="山田 太郎">
        </div>
        <div class="form-group">
          <label>基本時給（円）</label>
          <input type="number" id="new-wage" class="input" placeholder="1100">
        </div>
        <div class="form-group">
          <label>1日あたり交通費（円）</label>
          <input type="number" id="new-transport" class="input" value="0" placeholder="500">
        </div>
        <div class="form-group">
          <label>主たる所属店舗</label>
          <select id="new-store">
            <option value="木屋町御池個室店">木屋町御池個室店</option>
            <option value="烏丸三条個室店">烏丸三条個室店</option>
          </select>
        </div>
        <button class="btn btn-green" style="margin-top:1rem" onclick="addStaff()">＋ スタッフを追加</button>
      </div>

      <div class="card">
        <div class="card-title">マスターデータ保守</div>
        <div style="display:flex;flex-direction:column;gap:10px">
          <button class="btn btn-ghost" onclick="exportJSON()">💾 バックアップ用JSONを出力</button>
          <button class="btn btn-ghost" style="color:var(--red)" onclick="clearAll()">⚠️ スプレッドシート全消去リセット</button>
        </div>
        <div style="margin-top:1.5rem" id="settings-staff-list"></div>
      </div>
    </div>
  </div>
</div>

<div class="role-badge" onclick="triggerRoleModal()" id="role-indicator">🔑 スタッフモード</div>

<div class="modal" id="modal-login">
  <div class="modal-content">
    <div class="card-title" style="margin-bottom:1rem">管理者ログイン</div>
    <div class="form-group">
      <label>パスワードキーを入力してください</label>
      <input type="password" id="admin-pass" class="input" placeholder="••••••••">
    </div>
    <div class="btn-grid" style="margin-top:1.5rem">
      <button class="btn btn-ghost" onclick="closeModal('modal-login')">閉じる</button>
      <button class="btn btn-green" onclick="verifyAdmin()">ログイン</button>
    </div>
  </div>
</div>

<div class="modal" id="modal-edit">
  <div class="modal-content">
    <div class="card-title" style="margin-bottom:1rem">スタッフ情報の編集</div>
    <input type="hidden" id="edit-id">
    <div class="form-group">
      <label>名前</label>
      <input type="text" id="edit-name" class="input">
    </div>
    <div class="form-group">
      <label>時給</label>
      <input type="number" id="edit-wage" class="input">
    </div>
    <div class="form-group">
      <label>1日あたり交通費</label>
      <input type="number" id="edit-transport" class="input">
    </div>
    <div class="form-group">
      <label>所属店舗</label>
      <select id="edit-store">
        <option value="木屋町御池個室店">木屋町御池個室店</option>
        <option value="烏丸三条個室店">烏丸三条個室店</option>
      </select>
    </div>
    <div class="btn-grid" style="margin-top:1.5rem">
      <button class="btn btn-ghost" onclick="closeModal('modal-edit')">キャンセル</button>
      <button class="btn btn-amber" onclick="saveStaffEdit()">変更を保存</button>
    </div>
  </div>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzzfhCVmcTWgN73wcALYro8c3f5dEq3BQWT15iwX1-CgFq2GUks06VIi80WpBhxFoV2_A/exec";
const PASSKEY = "8888";

let staffList = [];
let records = [];
let me = { role: 'staff', staffId: null };

window.addEventListener('DOMContentLoaded', async () => {
  setupMonthFilter();
  await loadCloudData();
  renderStaffSelectAll(); // すべてのスタッフを表示
  renderAll();
});

async function loadCloudData() {
  document.getElementById('loading').style.display = 'flex';
  try {
    const res = await fetch(`${GAS_URL}?action=getData`);
    if (!res.ok) throw new Error('データ取得に失敗しました');
    const data = await res.json();
    staffList = data.staffList || [];
    records = data.records || [];
    // 過去のスタッフデータに「transport(交通費)」属性がない場合のケア
    staffList.forEach(s => { if(s.transport === undefined) s.transport = 0; });
  } catch (e) {
    alert('クラウドとの通信に失敗しました。\n' + e.message);
  } finally {
    document.getElementById('loading').style.display = 'none';
  }
}

async function syncToCloud() {
  document.getElementById('loading').style.display = 'flex';
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'syncData', staffList, records })
    });
    const result = await res.json();
    if (result.status !== 'success') throw new Error(result.message || '同期エラー');
  } catch (e) {
    alert('クラウドへの保存に失敗しました。\n' + e.message);
  } finally {
    document.getElementById('loading').style.display = 'none';
  }
}

function setupMonthFilter(){
  const els = [document.getElementById('filter-month'), document.getElementById('monthly-select-month')];
  els.forEach(el => {
    el.innerHTML = '';
    const now = new Date();
    for(let i=0; i<12; i++){
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const mStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      const mText = `${d.getFullYear()}年${d.getMonth()+1}月`;
      el.innerHTML += `<option value="${mStr}">${mText}</option>`;
    }
  });
}

// 修正：すべてのスタッフを選択できるように
function renderStaffSelectAll(){
  const el = document.getElementById('ci-staff');
  staffList.sort((a,b) => a.name.localeCompare(b.name, 'ja'));
  el.innerHTML = staffList.length 
    ? staffList.map(s => `<option value="${s.id}">${s.name} (${s.store.slice(0,3)})</option>`).join('')
    : '<option value="">（スタッフがいません）</option>';
}

function switchTab(tabId){
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tab-' + tabId).classList.add('active');
  
  if(tabId === 'monthly') renderMonthlySummary();
  if(tabId === 'yearly') renderYearlySummary();
}

function triggerRoleModal(){
  if(me.role === 'admin'){
    me.role = 'staff';
    document.body.classList.remove('is-admin');
    document.getElementById('role-indicator').innerHTML = '🔑 スタッフモード';
    switchTab('timecard');
    document.querySelectorAll('.tab-btn')[0].classList.add('active');
    renderAll();
    alert('ログアウトしました');
  } else {
    document.getElementById('modal-login').style.display = 'flex';
    document.getElementById('admin-pass').value = '';
    document.getElementById('admin-pass').focus();
  }
}

function verifyAdmin(){
  const pass = document.getElementById('admin-pass').value;
  if(pass === PASSKEY){
    me.role = 'admin';
    document.body.classList.add('is-admin');
    document.getElementById('role-indicator').innerHTML = '👑 管理者モード';
    closeModal('modal-login');
    renderAll();
    alert('管理者モードに切り替えました');
  } else { alert('パスワードキーが違います'); }
}

function closeModal(id){ document.getElementById(id).style.display = 'none'; }

// ⏰ 打刻
async function registerRecord(type){
  const staffId = document.getElementById('ci-staff').value;
  const store = document.getElementById('ci-store').value; // 打刻時に画面で選ばれている店舗
  if(!staffId){ alert('スタッフを選択してください'); return; }
  const staff = staffList.find(s => s.id == staffId);
  const note = document.getElementById('ci-note').value.trim();
  
  const now = new Date();
  const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  
  const newRecord = {
    id: Date.now(),
    staffId: staff.id,
    staffName: staff.name,
    store: store, // 所属ではなく「打刻店舗」を記録
    type: type,
    timestamp: now.toISOString(),
    dateStr: dateStr,
    timeStr: timeStr,
    note: note || 'なし'
  };
  
  records.push(newRecord);
  document.getElementById('ci-note').value = '';
  
  await syncToCloud();
  renderAll();
  alert(`${staff.name}さん：${store.slice(0,3)}での【${type}】を記録しました（${timeStr}）`);
}

// 👑 スタッフ追加
async function addStaff(){
  const name = document.getElementById('new-name').value.trim();
  const wage = parseInt(document.getElementById('new-wage').value);
  const transport = parseInt(document.getElementById('new-transport').value) || 0;
  const store = document.getElementById('new-store').value;
  if(!name || !wage){ alert('入力が正しくありません'); return; }
  
  staffList.push({ id: Date.now(), name, wage, transport, store });
  document.getElementById('new-name').value = '';
  document.getElementById('new-wage').value = '';
  document.getElementById('new-transport').value = '0';
  
  await syncToCloud();
  renderStaffSelectAll();
  renderAll();
  alert('スタッフを登録しました');
}

async function removeStaff(id){
  if(!confirm('削除しますか？（過去の出退勤明細は残ります）')) return;
  staffList = staffList.filter(s => s.id != id);
  await syncToCloud();
  renderStaffSelectAll();
  renderAll();
}

function openModal(id){
  const s = staffList.find(item => item.id == id);
  if(!s) return;
  document.getElementById('edit-id').value = s.id;
  document.getElementById('edit-name').value = s.name;
  document.getElementById('edit-wage').value = s.wage;
  document.getElementById('edit-transport').value = s.transport || 0;
  document.getElementById('edit-store').value = s.store;
  document.getElementById('modal-edit').style.display = 'flex';
}

async function saveStaffEdit(){
  const id = document.getElementById('edit-id').value;
  const name = document.getElementById('edit-name').value.trim();
  const wage = parseInt(document.getElementById('edit-wage').value);
  const transport = parseInt(document.getElementById('edit-transport').value) || 0;
  const store = document.getElementById('edit-store').value;
  
  const s = staffList.find(item => item.id == id);
  if(s){ s.name = name; s.wage = wage; s.transport = transport; s.store = store; }
  closeModal('modal-edit');
  
  await syncToCloud();
  renderStaffSelectAll();
  renderAll();
  alert('更新しました');
}

// 深夜手当計算用ヘルパー (22:00〜翌5:00の労働時間を計算)
function calculateNightHours(inDate, outDate) {
  let nightHours = 0;
  const checkStart = new Date(inDate.getTime());
  const checkEnd = new Date(outDate.getTime());
  
  // 30分ごとのステップで簡易スキャンして22時〜翌5時の間に入っているか判定
  let current = new Date(checkStart.getTime());
  const stepMs = 15 * 60 * 1000; // 15分刻み
  
  while (current < checkEnd) {
    const hour = current.getHours();
    // 22:00〜翌4:59の間
    if (hour >= 22 || hour < 5) {
      nightHours += 0.25; // 15分 = 0.25時間
    }
    current = new Date(current.getTime() + stepMs);
  }
  return nightHours;
}

// 共通集計ロジック：月と店舗でフィルタされた「成立ペア」を返す
function getCalculatedShiftLines(targetMonth, targetStore) {
  let filtered = records.filter(r => r.dateStr.startsWith(targetMonth));
  if(targetStore && targetStore !== 'ALL') {
    filtered = filtered.filter(r => r.store === targetStore);
  }
  
  const recordsByStaff = {};
  filtered.forEach(r => {
    if(!recordsByStaff[r.staffId]) recordsByStaff[r.staffId] = [];
    recordsByStaff[r.staffId].push(r);
  });
  
  const historyLines = [];
  
  Object.keys(recordsByStaff).forEach(sId => {
    const sLogs = recordsByStaff[sId].sort((a,b) => new Date(a.timestamp) - new Date(b.timestamp));
    const masterStaff = staffList.find(s => s.id == sId);
    const baseWage = masterStaff ? masterStaff.wage : 1100;
    const transportPerDay = masterStaff ? (masterStaff.transport || 0) : 0;
    
    let lastIn = null;
    
    sLogs.forEach(r => {
      if(r.type === '出勤'){
        lastIn = r;
      } else if(r.type === '退勤' && lastIn) {
        const inTime = new Date(lastIn.timestamp);
        const outTime = new Date(r.timestamp);
        const durationMs = outTime - inTime;
        const totalHours = Math.max(0, durationMs / (1000 * 60 * 60));
        
        // 深夜労働時間の算出
        const nightHours = calculateNightHours(inTime, outTime);
        
        // 金額計算
        const basePay = Math.round(totalHours * baseWage);
        const nightPremiumPay = Math.round(nightHours * baseWage * 0.25); // 25%の「手当」分
        
        historyLines.push({
          date: lastIn.dateStr,
          staffId: sId,
          name: masterStaff ? masterStaff.name : lastIn.staffName,
          homeStore: masterStaff ? masterStaff.store : '不明',
          workedStore: r.store, // 実際に働いた店舗
          inTime: lastIn.timeStr,
          outTime: r.timeStr,
          totalHours: totalHours,
          nightHours: nightHours,
          basePay: basePay,
          nightPay: nightPremiumPay,
          transport: transportPerDay, // 1勤務（1日）あたりの交通費
          note: r.note !== 'なし' ? r.note : (lastIn.note !== 'なし' ? lastIn.note : '')
        });
        lastIn = null;
      }
    });
  });
  
  return historyLines;
}

function renderAll(){
  renderTodayLogs();
  renderFilters();
  renderDashboard();
  renderSettingsStaff();
}

function renderTodayLogs(){
  const container = document.getElementById('today-logs');
  const now = new Date();
  const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  
  const todayRecords = records.filter(r => r.dateStr === todayStr).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
  if(!todayRecords.length){ container.innerHTML='<div style="font-size:13px;color:var(--ink3)">本日の打刻はありません</div>'; return;}
  
  container.innerHTML = todayRecords.map(r => `
    <div class="record-item">
      <div>
        <div style="font-size:13px;font-weight:700">${r.staffName}</div>
        <div style="font-size:11px;color:var(--ink3);margin-top:2px">場所: <span class="store-tag ${r.store==='木屋町御池個室店'?'store-k':'store-r'}">${r.store.slice(0,3)}</span> • 備考: ${r.note}</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="${r.type==='出勤'?'badge-in':'badge-out'}">${r.type}</span>
        <span class="time-mono">${r.timeStr}</span>
      </div>
    </div>`).join('');
}

function renderFilters(){
  const fStaff = document.getElementById('filter-staff');
  const current = fStaff.value;
  fStaff.innerHTML = '<option value="ALL">全てのスタッフを表示</option>' + 
    staffList.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
  if([...fStaff.options].some(o => o.value === current)) fStaff.value = current;
}

// タブ2: 履歴一覧の描画
function renderDashboard(){
  const targetMonth = document.getElementById('filter-month').value;
  const targetStore = document.getElementById('filter-store').value;
  const targetStaffId = document.getElementById('filter-staff').value;
  
  let lines = getCalculatedShiftLines(targetMonth, targetStore);
  if(me.role === 'admin' && targetStaffId !== 'ALL') lines = lines.filter(l => l.staffId == targetStaffId);
  
  const hListEl = document.getElementById('history-log-list');
  const sorted = lines.sort((a,b) => new Date(b.date) - new Date(a.date));
  
  if(!sorted.length){
    hListEl.innerHTML = '<div style="font-size:13px;color:var(--ink3)">該当する明細履歴がありません</div>';
    return;
  }
  
  hListEl.innerHTML = sorted.map(h => `
    <div class="record-item" style="flex-direction:column;align-items:flex-start;gap:4px">
      <div style="display:flex;justify-content:between;width:100%;font-size:12px;color:var(--ink3);font-weight:700">
        <span>${h.date} (勤務先: ${h.workedStore.slice(0,3)})</span>
        <span class="admin-only" style="color:var(--green)">基本:¥${h.basePay.toLocaleString()} / 深夜手当:¥${h.nightPay.toLocaleString()}</span>
      </div>
      <div style="display:flex;justify-content:between;width:100%;align-items:center">
        <span style="font-size:14px;font-weight:700">${h.name} <span style="font-size:10px;color:var(--ink3);font-weight:400">所属:${h.homeStore.slice(0,3)}</span></span>
        <span class="time-mono" style="font-size:13px">${h.inTime} 〜 ${h.outTime} <span style="font-size:11px;color:var(--ink3)">(${h.totalHours.toFixed(2)}h)</span></span>
      </div>
      ${h.nightHours > 0 ? `<div style="font-size:11px;color:var(--purple)">🌙 内、深夜労働: ${h.nightHours.toFixed(2)}h</div>` : ''}
      ${h.note && h.note !== 'なし' ? `<div style="font-size:11px;color:var(--amber);background:var(--amber-pale);padding:2px 6px;border-radius:4px;width:100%">💡 備考: ${h.note}</div>` : ''}
    </div>`).join('');
}

// タブ3: 月次スタッフ集計（給与、日数、交通費、深夜手当）の表示
function renderMonthlySummary(){
  const targetMonth = document.getElementById('monthly-select-month').value;
  const targetStore = document.getElementById('monthly-select-store').value;
  
  // 指定条件下のすべての成立したシフトを取得
  const lines = getCalculatedShiftLines(targetMonth, targetStore);
  
  // スタッフごとの集計コンテナ作成
  const summary = {};
  staffList.forEach(s => {
    summary[s.id] = { name: s.name, homeStore: s.store, days: 0, hours: 0, basePay: 0, transport: 0, nightPay: 0, total: 0 };
  });
  
  lines.forEach(l => {
    if(!summary[l.staffId]) {
      summary[l.staffId] = { name: l.name, homeStore: l.homeStore, days: 0, hours: 0, basePay: 0, transport: 0, nightPay: 0, total: 0 };
    }
    const s = summary[l.staffId];
    s.days += 1; // 1回ペア成立＝1日出勤
    s.hours += l.totalHours;
    s.basePay += l.basePay;
    s.transport += l.transport;
    s.nightPay += l.nightPay;
    s.total += (l.basePay + l.transport + l.nightPay);
  });
  
  const tbody = document.getElementById('monthly-summary-tbody');
  const activeRows = Object.values(summary).filter(s => s.days > 0);
  
  if(!activeRows.length) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--ink3)">当月の稼働データはありません</td></tr>';
    return;
  }
  
  tbody.innerHTML = activeRows.map(s => `
    <tr>
      <td style="font-weight:700">${s.name}</td>
      <td><span class="store-tag ${s.homeStore==='木屋町御池個室店'?'store-k':'store-r'}">${s.homeStore.slice(0,3)}</span></td>
      <td class="text-right">${s.days} 日</td>
      <td class="text-right time-mono">${s.hours.toFixed(2)}h</td>
      <td class="text-right">¥${s.basePay.toLocaleString()}</td>
      <td class="text-right">¥${s.transport.toLocaleString()}</td>
      <td class="text-right">¥${s.nightPay.toLocaleString()}</td>
      <td class="text-right style="font-weight:900;color:var(--green)"><b>¥${s.total.toLocaleString()}</b></td>
    </tr>
  `).join('');
}

// タブ4: 年次集計の表示
function renderYearlySummary(){
  const targetYear = document.getElementById('yearly-select-year').value;
  
  let kiyaYearTotal = 0;
  let karaYearTotal = 0;
  const monthRowsHtml = [];
  
  // 1月〜12月をループ
  for(let m=1; m<=12; m++) {
    const mStr = `${targetYear}-${String(m).padStart(2,'0')}`;
    
    // 木屋町での労働分
    const kiyaLines = getCalculatedShiftLines(mStr, '木屋町御池個室店');
    const kiyaPay = kiyaLines.reduce((sum, l) => sum + l.basePay + l.transport + l.nightPay, 0);
    
    // 烏丸での労働分
    const karaLines = getCalculatedShiftLines(mStr, '烏丸三条個室店');
    const karaPay = karaLines.reduce((sum, l) => sum + l.basePay + l.transport + l.nightPay, 0);
    
    kiyaYearTotal += kiyaPay;
    karaYearTotal += karaPay;
    
    if (kiyaPay > 0 || karaPay > 0) {
      monthRowsHtml.push(`
        <tr>
          <td style="font-weight:700">${m}月</td>
          <td class="text-right">¥${kiyaPay.toLocaleString()}</td>
          <td class="text-right">¥${karaPay.toLocaleString()}</td>
          <td class="text-right" style="font-weight:700;color:var(--green)">¥${(kiyaPay + karaPay).toLocaleString()}</td>
        </tr>
      `);
    }
  }
  
  document.getElementById('year-kiyamachi-total').textContent = `¥${kiyaYearTotal.toLocaleString()}`;
  document.getElementById('year-karasuma-total').textContent = `¥${karaYearTotal.toLocaleString()}`;
  
  const tbody = document.getElementById('yearly-summary-tbody');
  if(!monthRowsHtml.length) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--ink3)">選択された年の稼働データがありません</td></tr>';
  } else {
    tbody.innerHTML = monthRowsHtml.join('');
  }
}

        <div>

          <button class="btn btn-ghost" style="padding:4px 10px;font-size:11px" onclick="removeStaff(${s.id})">削除</button>

// 👑 便利な補助機能：テーブルデータを一発でコピーしてエクセルに貼り付けられるようにする
function copyTableToClipboard(tableId) {
  const table = document.getElementById(tableId);
  let text = "";
  for (let i = 0; i < table.rows.length; i++) {
    let row = table.rows[i];
    let rowText = [];
    for (let j = 0; j < row.cells.length; j++) {
      rowText.push(row.cells[j].innerText.replace(/,/g, '').replace(/¥/g, '')); // カンマと円マークを除去して数字として貼り付けやすく
    }
    text += rowText.join("\t") + "\n";
  }
  navigator.clipboard.writeText(text).then(() => {
    alert("表のデータをコピーしました！ExcelやGoogleスプレッドシートにそのまま貼り付け（Ctrl+V）できます。");
  });
}

function exportJSON(){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({staffList,records,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}));
  a.download = `attendance_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

async function clearAll(){
  if(!confirm('すべてのデータを完全に消去しますか？')) return;
  staffList = []; records = [];
  await syncToCloud();
  renderStaffSelectAll();
  renderAll();
  alert('クリアしました');
}
